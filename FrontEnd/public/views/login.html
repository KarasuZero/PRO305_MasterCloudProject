<HTML>
    <head>
        <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
      integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk"
      crossorigin="anonymous"
    />
    <title>Fast Lane Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Akshar:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css" />
    </head>
    <body>
        <section class="vh-100">
            <div class="container-fluid">
              <div class="row">
                <div class="col-sm-6 text-black">
          
                  <div class="align-left px-0 ms-xl-0 h-25">
                    <span class="h1 fw-bold mb-0" style="font-family: 'Akshar', sans-serif; font-weight: bold;">Fast Lane</span>
                  </div>
          
                  <div class="mx-auto align-items-center h-custom-6 px-50 ms-xl-4 mt-5 pt-5 pt-xl-50 mt-xl-n5"
                  style="width:370px;">
          
                    <form style="width: 23rem;" id="loginForm">
          
                      <h3 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px;">Log in</h3>
          
                      <div class="form-outline mb-4">
                        <input type="username" id="username" class="form-control form-control-lg" />
                        <label class="form-label" for="username">Username</label>
                      </div>
          
                      <div class="form-outline mb-4">
                        <input type="password" id="password" class="form-control form-control-lg" />
                        <label class="form-label" for="password">Password</label>
                      </div>
          
                      <div class="pt-1 mb-4">
                        <button id="loginButton" class="btn btn-info btn-lg btn-block" type="button" style="background-color: rgb(249, 80, 80); outline-style: auto; outline-color: red;">Login</button>
                      </div>
          
                      <!--<p class="small mb-5 pb-lg-2"><a class="text-muted" href="#!">Forgot password?</a></p>-->
                      <p>Don't have an account? <a href="http://localhost:3031/register" class="link-info">Register here</a></p>
          
                    </form>
          
                  </div>
          
                </div>
                <div class="col-sm-6 px-0 d-none d-sm-block">
                  <img src="https://i.imgur.com/mAvgDTl.jpg"
                    alt="Login image" class="w-100 vh-100" style="object-fit: cover; object-position: left;">
                </div>
              </div>
            </div>
          </section>
    </body>
    <script src="/javascript/login.js"></script>
</HTML>
