<div class="container">
    <div>
        <h1 class="text-center" style="font-family: 'Akshar', sans-serif; font-weight: bold;">Fast Lane</h1>
    </div>

<hr>

<div class="row justify-content-center">
<div class="col-md-6">
<div class="card">
<header class="card-header">
	<a href="http://localhost:3031/login" class="float-right btn mt-1" style="color: rgb(249, 80, 80); outline-color: rgb(249, 80, 80); outline-style: auto; ">Log in</a>
	<h4 class="card-title mt-2">Sign up</h4>
</header>
<article class="card-body">
<form>
	<div class="form-row">
		<div class="col form-group">
			<label>Name </label>   
		  	<input type="text" class="form-control" placeholder="">
		</div> <!-- form-group end.// -->
		<div class="col form-group">
			<label>Username</label>
		  	<input type="text" class="form-control" placeholder=" ">
		</div> <!-- form-group end.// -->
	</div> <!-- form-row end.// -->
	<div class="form-group">
		<label>Email address</label>
		<input type="email" class="form-control" placeholder="">
		<small class="form-text text-muted">We'll never share your email with anyone else.</small>
	</div> <!-- form-group end.// -->
	<div class="form-group">
			<label class="form-check form-check-inline">
		  <input class="form-check-input" type="radio" name="usertype" value="option1" id="ownerSelect">
		  <span class="form-check-label"> Resturant Owner </span>
		</label>
		<label class="form-check form-check-inline">
		  <input class="form-check-input" type="radio" name="usertype" value="option2" id="userSelect">
		  <span class="form-check-label"> User </span>
		</label>
	</div> <!-- form-group end.// -->
	<div class="form-row">
		<div class="form-group col-md-6" style="display: none;" id="phoneNumber">
		  <label>Phone Number</label>
		  <input type="text" class="form-control">
		</div> <!-- form-group end.// -->
	</div> <!-- form-row.// -->
	<div class="form-group">
		<label>Create password</label>
	    <input class="form-control" type="password">
	</div> <!-- form-group end.// -->  
    <div class="form-group">
        <button type="submit" class="btn btn-primary btn-block" style="background-color: rgb(249, 80, 80); outline-style: auto; outline-color: red;"> Register  </button>
    </div> <!-- form-group// -->      
    <small class="text-muted">By clicking the 'Sign Up' button, you confirm that you accept our <br> Terms of use and Privacy Policy.</small>                                          
</form>
</article> <!-- card-body end .// -->
<div class="border-top card-body text-center">Have an account? <a href="http://localhost:3031/login">Log In</a></div>
</div> <!-- card.// -->
</div> <!-- col.//-->
